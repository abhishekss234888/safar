<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFAR - The Guardian Tracker</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           DIVINE VARIABLES — THE COSMIC PALETTE
           ============================================================ */
        :root {
            --primary: #6C5CE7;
            --primary-light: #8B7CF7;
            --primary-dark: #4A3DB8;
            --primary-glow: rgba(108, 92, 231, 0.5);
            --primary-super-glow: rgba(108, 92, 231, 0.2);

            --secondary: #00CEC9;
            --secondary-glow: rgba(0, 206, 201, 0.4);

            --tertiary: #FD79A8;
            --tertiary-glow: rgba(253, 121, 168, 0.4);

            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #FF7675;

            /* Light Mode — Celestial */
            --bg-primary: #EDEAF6;
            --bg-secondary: #E4DFF2;
            --bg-tertiary: #F5F0FF;

            /* Liquid Glass */
            --surface: rgba(255, 255, 255, 0.22);
            --surface-hover: rgba(255, 255, 255, 0.48);
            --surface-active: rgba(255, 255, 255, 0.70);
            --surface-border: rgba(255, 255, 255, 0.50);
            --surface-border-glow: rgba(255, 255, 255, 0.80);

            /* Divine Shadows */
            --shadow-layer-1: 0 2px 8px -2px rgba(108, 92, 231, 0.04);
            --shadow-layer-2: 0 8px 32px -8px rgba(108, 92, 231, 0.08);
            --shadow-layer-3: 0 20px 64px -16px rgba(108, 92, 231, 0.12);
            --shadow-layer-4: 0 40px 96px -24px rgba(108, 92, 231, 0.16);
            --shadow-layer-5: 0 60px 128px -32px rgba(108, 92, 231, 0.08);
            --shadow-layer-6: inset 0 1px 0 rgba(255, 255, 255, 0.7);
            --shadow-layer-7: inset 0 -1px 0 rgba(255, 255, 255, 0.3);

            --text-primary: #14142A;
            --text-secondary: #4A4A6A;
            --text-tertiary: #6A6A8A;
            --text-muted: #9A9ABA;

            --ambient-1: rgba(108, 92, 231, 0.06);
            --ambient-2: rgba(0, 206, 201, 0.04);
            --ambient-3: rgba(253, 121, 168, 0.03);
            --ambient-4: rgba(253, 203, 110, 0.02);
            --ambient-5: rgba(108, 92, 231, 0.02);
            --ambient-6: rgba(0, 206, 201, 0.015);

            --card-radius: 36px;
            --inner-radius: 22px;
            --pill-radius: 50px;
            --gap: 18px;

            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;

            --scrollbar-thumb: #C0C0D8;
            --scrollbar-track: transparent;
        }

        /* Dark Mode */
        body.dark-mode {
            --bg-primary: #060812;
            --bg-secondary: #0A0D1A;
            --bg-tertiary: #0E1122;
            --surface: rgba(18, 22, 40, 0.35);
            --surface-hover: rgba(28, 33, 56, 0.60);
            --surface-active: rgba(38, 44, 68, 0.78);
            --surface-border: rgba(255, 255, 255, 0.05);
            --surface-border-glow: rgba(255, 255, 255, 0.12);
            --shadow-layer-1: 0 2px 8px -2px rgba(0, 0, 0, 0.3);
            --shadow-layer-2: 0 8px 32px -8px rgba(0, 0, 0, 0.4);
            --shadow-layer-3: 0 20px 64px -16px rgba(0, 0, 0, 0.5);
            --shadow-layer-4: 0 40px 96px -24px rgba(0, 0, 0, 0.6);
            --shadow-layer-5: 0 60px 128px -32px rgba(0, 0, 0, 0.3);
            --shadow-layer-6: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            --shadow-layer-7: inset 0 -1px 0 rgba(255, 255, 255, 0.01);
            --text-primary: #EAEAF4;
            --text-secondary: #B0B0CC;
            --text-tertiary: #8A8AAA;
            --text-muted: #6A6A8A;
            --ambient-1: rgba(108, 92, 231, 0.10);
            --ambient-2: rgba(0, 206, 201, 0.06);
            --ambient-3: rgba(253, 121, 168, 0.04);
            --ambient-4: rgba(253, 203, 110, 0.03);
            --ambient-5: rgba(108, 92, 231, 0.05);
            --ambient-6: rgba(0, 206, 201, 0.025);
            --scrollbar-thumb: #2A2A44;
        }

        /* ============================================================
           BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 14px 60px;
            transition: background 1s cubic-bezier(0.34, 1.56, 0.64, 1),
                color 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glow */
        body::before {
            content: '';
            position: fixed;
            inset: -60%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 10% 10%, var(--ambient-1) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 15%, var(--ambient-2) 0%, transparent 35%),
                radial-gradient(ellipse at 50% 90%, var(--ambient-3) 0%, transparent 40%),
                radial-gradient(ellipse at 15% 80%, var(--ambient-4) 0%, transparent 30%),
                radial-gradient(ellipse at 75% 40%, var(--ambient-5) 0%, transparent 45%),
                radial-gradient(ellipse at 30% 55%, var(--ambient-6) 0%, transparent 35%);
            pointer-events: none;
            transition: background 1.2s ease;
            animation: cosmicBreath 14s ease-in-out infinite;
        }

        @keyframes cosmicBreath {
            0%,
            100% {
                transform: scale(1) rotate(0deg) translate(0, 0);
                opacity: 1;
            }
            25% {
                transform: scale(1.04) rotate(0.8deg) translate(2%, -1%);
                opacity: 0.92;
            }
            50% {
                transform: scale(0.96) rotate(-0.6deg) translate(-1%, 2%);
                opacity: 0.88;
            }
            75% {
                transform: scale(1.02) rotate(0.4deg) translate(1%, -2%);
                opacity: 0.95;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 20px;
            box-shadow: 0 0 40px var(--primary-glow);
            transition: background 0.4s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ============================================================
           DASHBOARD
           ============================================================ */
        .dashboard {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        /* ============================================================
           LIQUID GLASS
           ============================================================ */
        .god-glass {
            backdrop-filter: blur(32px) saturate(2.6) contrast(1.35) brightness(1.12);
            -webkit-backdrop-filter: blur(32px) saturate(2.6) contrast(1.35) brightness(1.12);
            background: var(--surface);
            border: 1px solid var(--surface-border);
            box-shadow:
                var(--shadow-layer-1),
                var(--shadow-layer-2),
                var(--shadow-layer-3),
                var(--shadow-layer-4),
                var(--shadow-layer-5),
                var(--shadow-layer-6),
                var(--shadow-layer-7);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .god-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 85% 65%, rgba(255, 255, 255, 0.20) 0%, transparent 40%),
                radial-gradient(circle at 45% 92%, rgba(255, 255, 255, 0.10) 0%, transparent 30%),
                radial-gradient(circle at 70% 20%, rgba(108, 92, 231, 0.04) 0%, transparent 35%);
            mix-blend-mode: overlay;
            opacity: 0.75;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 1;
            animation: sheenDrift 12s ease-in-out infinite;
        }

        @keyframes sheenDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(2%, -1%) scale(1.02);
            }
            66% {
                transform: translate(-1%, 2%) scale(0.98);
            }
        }

        .god-glass::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: calc(var(--card-radius) - 2px);
            pointer-events: none;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.20) 0%,
                    transparent 25%,
                    transparent 65%,
                    rgba(255, 255, 255, 0.06) 85%,
                    rgba(255, 255, 255, 0.12) 100%);
            opacity: 0.5;
            transition: opacity 0.6s ease;
            z-index: 1;
        }

        .god-glass .chromatic-glow {
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--card-radius) + 2px);
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 206, 201, 0.03) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(253, 121, 168, 0.02) 0%, transparent 35%);
            opacity: 0.3;
            z-index: 0;
            transition: opacity 0.6s ease;
            filter: blur(8px);
        }

        .god-glass:hover {
            transform: translateY(-6px) scale(1.012) rotateX(0.5deg);
            background: var(--surface-hover);
            box-shadow:
                0 4px 16px -4px rgba(108, 92, 231, 0.10),
                0 16px 56px -12px rgba(108, 92, 231, 0.16),
                0 32px 88px -20px rgba(108, 92, 231, 0.12),
                0 56px 136px -28px rgba(108, 92, 231, 0.08),
                0 80px 180px -36px rgba(108, 92, 231, 0.04),
                var(--shadow-layer-6),
                var(--shadow-layer-7);
            border-color: var(--surface-border-glow);
        }

        .god-glass:hover::before {
            opacity: 1;
            transform: scale(1.04) translate(0, 0);
        }

        .god-glass:hover::after {
            opacity: 0.8;
        }

        .god-glass:hover .chromatic-glow {
            opacity: 0.6;
        }

        /* ============================================================
           GLASS CARD
           ============================================================ */
        .glass-card {
            border-radius: var(--card-radius);
            padding: 22px 24px;
            animation: divineReveal 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes divineReveal {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.92) rotateX(8deg);
                filter: blur(16px);
            }
            40% {
                transform: translateY(-8px) scale(1.018) rotateX(-2deg);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
                filter: blur(0);
            }
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            composes: god-glass;
            position: sticky;
            top: 14px;
            z-index: 50;
            border-radius: var(--card-radius);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: -0.03em;
            position: relative;
        }

        .header-brand i {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--tertiary), var(--primary));
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: divineShift 5s ease-in-out infinite;
        }

        @keyframes divineShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        .header-brand span {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--primary-super-glow);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ============================================================
           STATUS BADGE
           ============================================================ */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 12px;
            border-radius: var(--pill-radius);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(0, 184, 148, 0.08);
            color: var(--success);
            border: 1px solid rgba(0, 184, 148, 0.12);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.10) 0%, transparent 60%);
            pointer-events: none;
        }

        .status-badge.offline {
            background: rgba(140, 140, 160, 0.06);
            color: var(--text-muted);
            border-color: rgba(140, 140, 160, 0.08);
        }

        .status-badge.warning {
            background: rgba(253, 203, 110, 0.12);
            color: var(--warning);
            border-color: rgba(253, 203, 110, 0.20);
        }

        .status-badge.arrived {
            background: rgba(253, 121, 168, 0.10);
            color: var(--tertiary);
            border-color: rgba(253, 121, 168, 0.20);
            animation: arrivalGlow 1.8s ease-in-out infinite;
        }

        @keyframes arrivalGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(253, 121, 168, 0.03);
            }
            50% {
                box-shadow: 0 0 60px rgba(253, 121, 168, 0.18);
            }
        }

        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: livePulse 1.2s ease-in-out infinite;
            flex-shrink: 0;
            transition: background 0.4s ease;
            box-shadow: 0 0 30px var(--success);
        }

        .status-badge.offline .live-dot {
            background: var(--text-muted);
            animation: none;
            box-shadow: none;
        }

        .status-badge.warning .live-dot {
            background: var(--warning);
            box-shadow: 0 0 30px var(--warning);
        }

        .status-badge.arrived .live-dot {
            background: var(--tertiary);
            animation: none;
            box-shadow: 0 0 30px var(--tertiary-glow);
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.1;
                transform: scale(0.3);
            }
        }

        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(2);
            -webkit-backdrop-filter: blur(24px) saturate(2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-layer-1), var(--shadow-layer-2);
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.50) 0%, transparent 55%);
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.15) rotate(15deg);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 60px var(--primary-glow), var(--shadow-layer-3), var(--shadow-layer-4);
        }

        .theme-toggle:active {
            transform: scale(0.90);
        }

        .theme-toggle:hover::before {
            opacity: 1;
        }

        /* ============================================================
           MAP CARD — REAL GOOGLE MAPS
           ============================================================ */
        .map-card {
            position: relative;
            padding: 0;
            height: 350px;
            border-radius: var(--card-radius);
            cursor: default;
            overflow: hidden;
            background: var(--bg-secondary);
            transition: background 0.8s ease;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: var(--card-radius);
        }

        /* ============================================================
           STATS ROW
           ============================================================ */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-card {
            composes: god-glass;
            border-radius: var(--card-radius);
            padding: 18px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .stat-card:hover {
            transform: translateY(-3px) scale(1.01);
            background: var(--surface-hover);
        }

        .stat-icon {
            font-size: 1.3rem;
            color: var(--primary);
            transition: color 0.4s ease;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            transition: all 0.3s ease;
            position: relative;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        /* ============================================================
           ARRIVAL BANNER
           ============================================================ */
        .arrival-banner {
            display: none;
            composes: god-glass;
            border-radius: var(--card-radius);
            padding: 20px 24px;
            text-align: center;
            background: linear-gradient(135deg, rgba(253, 121, 168, 0.12), rgba(0, 184, 148, 0.08));
            border: 1.5px solid rgba(253, 121, 168, 0.25);
            box-shadow:
                0 16px 64px -16px rgba(253, 121, 168, 0.20),
                var(--shadow-layer-3),
                var(--shadow-layer-4);
            animation: bannerDivine 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .arrival-banner.visible {
            display: block;
        }

        @keyframes bannerDivine {
            0% {
                opacity: 0;
                transform: scale(0.80) translateY(20px) rotateX(10deg);
                filter: blur(10px);
            }
            50% {
                transform: scale(1.04) translateY(-4px) rotateX(-2deg);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotateX(0);
                filter: blur(0);
            }
        }

        .arrival-banner .celebration-icon {
            font-size: 2.8rem;
            animation: pinBounce 0.8s ease-in-out infinite;
            display: block;
            margin-bottom: 6px;
        }

        @keyframes pinBounce {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-22px) scale(1.10);
            }
        }

        .arrival-banner .arrival-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--tertiary), #FFB8D0, var(--tertiary));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 4px 0;
            animation: etaShift 2s ease-in-out infinite;
        }

        @keyframes etaShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .arrival-banner .arrival-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ============================================================
           CONFETTI
           ============================================================ */
        .confetti-container {
            position: absolute;
            pointer-events: none;
            inset: 0;
            overflow: hidden;
            z-index: 30;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            animation: confettiDivine 3s ease-out forwards;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes confettiDivine {
            0% {
                transform: translateY(-80px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(450px) rotate(1080deg) scale(0.1);
                opacity: 0;
            }
        }

        /* ============================================================
           TIMELINE
           ============================================================ */
        .timeline-card {
            composes: glass-card;
        }

        .timeline-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
            color: var(--text-primary);
            position: relative;
            display: inline-block;
        }

        .timeline-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 40%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }

        .timeline-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 0 12px 18px;
            border-left: 2px solid rgba(108, 92, 231, 0.10);
            position: relative;
            animation: timelineDivine 0.6s ease-out both;
        }

        @keyframes timelineDivine {
            0% {
                opacity: 0;
                transform: translateX(-14px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 16px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            border: 2px solid var(--bg-primary);
        }

        .timeline-item:last-child {
            border-left-color: transparent;
        }

        .timeline-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
            min-width: 60px;
            font-weight: 700;
            padding-top: 2px;
        }

        .timeline-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.5;
        }

        .timeline-desc strong {
            color: var(--text-primary);
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ============================================================
           FOOTER ACTIONS
           ============================================================ */
        .footer-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            composes: god-glass;
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--pill-radius);
            border: 1px solid var(--surface-border);
            background: var(--surface);
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 0.82rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-layer-1), var(--shadow-layer-2);
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.25) 0%, transparent 55%);
            pointer-events: none;
            opacity: 0.4;
            transition: opacity 0.4s ease;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.015);
            background: var(--surface-hover);
            box-shadow:
                0 12px 48px -12px rgba(108, 92, 231, 0.20),
                var(--shadow-layer-3),
                var(--shadow-layer-4);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn:hover::before {
            opacity: 0.8;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-color: var(--primary);
            box-shadow:
                0 8px 32px -8px rgba(108, 92, 231, 0.4),
                var(--shadow-layer-3);
        }

        .btn-primary::before {
            background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.30) 0%, transparent 55%);
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #5B4BD4, #4A3DB8);
            color: #fff;
            border-color: #5B4BD4;
            box-shadow:
                0 12px 48px -12px rgba(108, 92, 231, 0.5),
                var(--shadow-layer-4);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 480px) {
            .dashboard {
                max-width: 480px;
            }
            .map-card {
                height: 350px;
            }
            .stat-value {
                font-size: 2.2rem;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 36px 24px 70px;
            }
            .dashboard {
                max-width: 540px;
                gap: 20px;
            }
            .map-card {
                height: 380px;
            }
            .stat-card {
                padding: 22px 18px;
            }
            .stat-value {
                font-size: 2.4rem;
            }
        }

        @media (min-width: 1024px) {
            .dashboard {
                max-width: 580px;
            }
            .map-card {
                height: 420px;
            }
            .stat-value {
                font-size: 2.6rem;
            }
            .header-brand {
                font-size: 1.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .btn:focus-visible,
        .theme-toggle:focus-visible {
            outline: 4px solid var(--primary);
            outline-offset: 6px;
        }

        .hidden {
            display: none !important;
        }

        .stats-row-single {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* ============================================================
           🔒 AUTH GATE — content stays hidden until Firebase confirms
           the visitor is signed in. See the module script below for
           the check (onAuthStateChanged) and the redirect to login.html.
           ============================================================ */
        body:not(.authed) .dashboard {
            display: none;
        }

        #authGate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            transition: opacity .35s ease;
        }
        body.authed #authGate {
            opacity: 0;
            pointer-events: none;
        }
        .auth-gate-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid var(--surface-border);
            border-top-color: var(--primary);
            animation: authGateSpin .8s linear infinite;
        }
        @keyframes authGateSpin {
            to { transform: rotate(360deg); }
        }
        .auth-gate-text {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: .2px;
            color: var(--text-tertiary);
        }
        .logout-btn {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    🔒 AUTH GATE — shown until Firebase confirms a signed-in user.
    The dashboard below is hidden by CSS until <body> gets the
    "authed" class from the script at the bottom of this file.
    ============================================================ -->
    <div id="authGate" aria-live="polite">
        <div class="auth-gate-spinner" aria-hidden="true"></div>
        <div class="auth-gate-text" id="authGateText">Checking your session…</div>
    </div>

    <!-- ============================================================
    CONFETTI
    ============================================================ -->
    <div class="confetti-container" id="confettiContainer" aria-hidden="true"></div>

    <!-- ============================================================
    DASHBOARD
    ============================================================ -->
    <main class="dashboard" role="main" aria-label="GPS Tracker Dashboard">

        <!-- HEADER -->
        <header class="header" role="banner">
            <div class="header-brand">
                <i class="fa-solid fa-shield-halved"></i>
                <span>SAFAR</span>
            </div>
            <div class="header-actions">
                <div class="status-badge" id="statusBadge" aria-live="polite">
                    <span class="live-dot"></span>
                    <span id="statusText">Live</span>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <button class="theme-toggle logout-btn" id="logoutBtn" aria-label="Sign out" title="Sign out">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- MAP CARD — GOOGLE MAPS -->
        <section class="map-card god-glass" id="mapCard" aria-label="Live map view" style="animation-delay:0.03s;">
            <div class="chromatic-glow"></div>
            <div id="map"></div>
        </section>

        <!-- STATS -->
        <div class="stats-row-single" aria-label="Key statistics">
            <div class="stat-card" id="speedCard" aria-label="Current speed">
                <i class="fa-solid fa-gauge-high stat-icon"></i>
                <span class="stat-value" id="speedValue">0</span>
                <span class="stat-label">Speed (mph)</span>
            </div>
        </div>

        <!-- ARRIVAL -->
        <div class="arrival-banner" id="arrivalBanner" role="alert" aria-live="assertive">
            <div class="arrival-text">Destination Reached!</div>
            <div class="arrival-sub">The bus has arrived safely at the destination.</div>
        </div>

        <!-- TIMELINE -->
        <section class="timeline-card" aria-label="Activity timeline">
            <h2 class="timeline-title">Recent Activity</h2>
            <ul class="timeline-list" id="timelineList">
                <li class="timeline-item" style="animation-delay:0.07s;">
                    <span class="timeline-time">Just now</span>
                    <span class="timeline-desc">Connecting to Firebase...</span>
                </li>
            </ul>
        </section>

        <!-- FOOTER -->
        <div class="footer-actions">
            <button class="btn btn-primary" id="refreshBtn" aria-label="Refresh tracker data">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>

    </main>

    <!-- ============================================================
    GOOGLE MAPS API — REPLACE YOUR_API_KEY
    ============================================================ -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer>
    </script>

    <!-- ============================================================
    JAVASCRIPT — PRODUCTION READY
    ============================================================ -->
    <script type="module">
        // ============================================================
        // 🔥 FIREBASE IMPORTS
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // ============================================================
        // 📝 FIREBASE CONFIG — COMPLETE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAYTf-UIqkBiCpt8GOBdYB6BIUZkm8wRns",
            authDomain: "safar-859.firebaseapp.com",
            databaseURL: "https://safar-859-default-rtdb.firebaseio.com",
            projectId: "safar-859",
            storageBucket: "safar-859.firebasestorage.app",
            messagingSenderId: "384919146276",
            appId: "1:384919146276:web:f0dd43a34736204e1d6db1",
            measurementId: "G-D22V0GQVJ1"
        };

        // ============================================================
        // 🚀 INITIALIZE FIREBASE
        // ============================================================
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        console.log("🔥 Firebase connected successfully!");

        // ============================================================
        // 🔒 AUTH GATE — this page's content is hidden (see CSS) until
        // Firebase confirms someone is signed in. Anyone without a
        // session gets bounced back to login.html.
        // ============================================================
        const authGateText = document.getElementById('authGateText');
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.body.classList.add('authed');
            } else {
                if (authGateText) authGateText.textContent = 'Redirecting to login…';
                window.location.replace('login.html');
            }
        });

        // ============================================================
        // 📊 STATE
        // ============================================================
        const state = {
            latitude: 0,
            longitude: 0,
            speedMph: 0,
            driverStatus: 'live',
            alerts: [],
            events: [],
            isArrived: false,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);
        const dom = {
            statusBadge: $('statusBadge'),
            statusText: $('statusText'),
            themeToggle: $('themeToggle'),
            themeIcon: $('themeIcon'),
            speedValue: $('speedValue'),
            speedCard: $('speedCard'),
            arrivalBanner: $('arrivalBanner'),
            confettiContainer: $('confettiContainer'),
            timelineList: $('timelineList'),
            refreshBtn: $('refreshBtn'),
            logoutBtn: $('logoutBtn'),
        };

        // ============================================================
        // 🗺️ GOOGLE MAPS — GLOBAL FOR CALLBACK
        // ============================================================
        let map;
        let marker;
        let mapInitialized = false;

        window.initMap = function() {
            const defaultLocation = { lat: 37.7749, lng: -122.4194 };
            map = new google.maps.Map(document.getElementById('map'), {
                center: defaultLocation,
                zoom: 14,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                    {
                        featureType: "administrative.locality",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#d59563" }]
                    },
                    {
                        featureType: "poi",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#d59563" }]
                    },
                    {
                        featureType: "poi.park",
                        elementType: "geometry",
                        stylers: [{ color: "#263c3f" }]
                    },
                    {
                        featureType: "poi.park",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#6b9a76" }]
                    },
                    {
                        featureType: "road",
                        elementType: "geometry",
                        stylers: [{ color: "#38414e" }]
                    },
                    {
                        featureType: "road",
                        elementType: "geometry.stroke",
                        stylers: [{ color: "#212a37" }]
                    },
                    {
                        featureType: "road",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#9ca5b3" }]
                    },
                    {
                        featureType: "road.highway",
                        elementType: "geometry",
                        stylers: [{ color: "#746855" }]
                    },
                    {
                        featureType: "road.highway",
                        elementType: "geometry.stroke",
                        stylers: [{ color: "#1f2835" }]
                    },
                    {
                        featureType: "road.highway",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#f3d19c" }]
                    },
                    {
                        featureType: "transit",
                        elementType: "geometry",
                        stylers: [{ color: "#2f3948" }]
                    },
                    {
                        featureType: "transit.station",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#d59563" }]
                    },
                    {
                        featureType: "water",
                        elementType: "geometry",
                        stylers: [{ color: "#17263c" }]
                    },
                    {
                        featureType: "water",
                        elementType: "labels.text.fill",
                        stylers: [{ color: "#515c6d" }]
                    },
                    {
                        featureType: "water",
                        elementType: "labels.text.stroke",
                        stylers: [{ color: "#17263c" }]
                    }
                ]
            });

            marker = new google.maps.Marker({
                position: defaultLocation,
                map: map,
                icon: {
                    url: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
                    scaledSize: new google.maps.Size(40, 40)
                },
                animation: google.maps.Animation.DROP,
                title: 'Bus Location'
            });

            mapInitialized = true;
            console.log('🗺️ Google Maps initialized!');
        };

        // ============================================================
        // 📍 UPDATE MAP LOCATION
        // ============================================================
        function updateMapLocation(lat, lng) {
            if (!mapInitialized || !map || !marker) return;

            const position = { lat: lat, lng: lng };
            map.setCenter(position);
            marker.setPosition(position);
            marker.setAnimation(google.maps.Animation.BOUNCE);
            setTimeout(() => marker.setAnimation(null), 1500);
        }

        // ============================================================
        // 📋 TIMELINE FUNCTIONS — LATEST ON TOP
        // ============================================================
        function addTimelineEvent(desc, isAlert = false) {
            const list = dom.timelineList;
            const li = document.createElement('li');
            li.className = 'timeline-item';
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            li.innerHTML = `
                <span class="timeline-time">${timeStr}</span>
                <span class="timeline-desc">${isAlert ? '⚠️ ' : ''}${desc}</span>
            `;
            // Insert at top (latest first)
            list.prepend(li);

            // Keep only last 20 items
            while (list.children.length > 20) {
                list.removeChild(list.lastChild);
            }

            // Trigger animation
            li.style.animation = 'none';
            requestAnimationFrame(() => {
                li.style.animation = 'timelineDivine 0.6s ease-out both';
            });

            state.events.push({ time: now, desc: desc, isAlert });
        }

        // ============================================================
        // 🚦 DRIVER STATUS UPDATE
        // ============================================================
        function updateDriverStatus() {
            const badge = dom.statusBadge;
            const text = dom.statusText;
            badge.classList.remove('offline', 'warning', 'arrived');

            switch (state.driverStatus) {
                case 'live':
                    text.textContent = '✅ Live';
                    break;
                case 'phone':
                    text.textContent = '📱 Phone!';
                    badge.classList.add('warning');
                    break;
                case 'distracted':
                    text.textContent = '⚠️ Distracted!';
                    badge.classList.add('warning');
                    break;
                case 'arrived':
                    text.textContent = '🏁 Arrived';
                    badge.classList.add('arrived');
                    break;
                case 'offline':
                    text.textContent = '📡 Offline';
                    badge.classList.add('offline');
                    break;
                default:
                    text.textContent = state.driverStatus || 'Live';
            }
        }

        // ============================================================
        // 🎉 ARRIVAL CELEBRATION
        // ============================================================
        function triggerArrival() {
            if (state.isArrived) return;
            state.isArrived = true;
            dom.arrivalBanner.classList.add('visible');
            addTimelineEvent('🎉 Destination reached! Bus has arrived safely.', false);
            spawnConfetti();
            playArrivalSound();

            state.driverStatus = 'arrived';
            updateDriverStatus();
        }

        // ============================================================
        // 🎊 CONFETTI
        // ============================================================
        function spawnConfetti() {
            const container = dom.confettiContainer;
            const colors = ['#FD79A8', '#6C5CE7', '#00CEC9', '#FDCB6E', '#00B894', '#FF7675', '#FFB8D0', '#A29BFE'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = (-10 - Math.random() * 30) + 'px';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = (6 + Math.random() * 10) + 'px';
                piece.style.height = (6 + Math.random() * 10) + 'px';
                piece.style.animationDuration = (2.5 + Math.random() * 3) + 's';
                piece.style.animationDelay = (Math.random() * 1.2) + 's';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 5000);
            }
        }

        // ============================================================
        // 🔔 ARRIVAL SOUND
        // ============================================================
        function playArrivalSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const notes = [880, 1100, 1320, 1760];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const startTime = ctx.currentTime + i * 0.15;
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
                    osc.start(startTime);
                    osc.stop(startTime + 0.5);
                });
            } catch (e) {}
        }

        // ============================================================
        // 🌓 THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            dom.themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('safar-theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const saved = localStorage.getItem('safar-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved === 'dark' || (!saved && prefersDark);
            if (isDark) {
                document.body.classList.add('dark-mode');
                dom.themeIcon.className = 'fa-solid fa-sun';
            }
        }

        // ============================================================
        // 📡 FIREBASE REAL-TIME LISTENERS
        // ============================================================

        // 1. BUS LOCATION
        const locationRef = ref(db, 'bus/currentLocation');
        onValue(locationRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lng) {
                state.latitude = data.lat;
                state.longitude = data.lng;
                updateMapLocation(data.lat, data.lng);
                addTimelineEvent(`📍 Location: ${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}`);
            }
        }, (error) => {
            console.error('Location listener error:', error);
        });

        // 2. BUS SPEED
        const speedRef = ref(db, 'bus/speed');
        onValue(speedRef, (snapshot) => {
            const speed = snapshot.val();
            if (speed !== null && speed !== undefined) {
                state.speedMph = typeof speed === 'number' ? speed : parseFloat(speed) || 0;
                dom.speedValue.textContent = Math.round(state.speedMph);

                if (state.speedMph > 65) {
                    dom.speedCard.classList.add('warning-flash');
                    setTimeout(() => dom.speedCard.classList.remove('warning-flash'), 2000);
                }
            }
        }, (error) => {
            console.error('Speed listener error:', error);
        });

        // 3. DRIVER STATUS
        const driverRef = ref(db, 'driver/status');
        onValue(driverRef, (snapshot) => {
            const status = snapshot.val();
            if (status) {
                state.driverStatus = status;
                updateDriverStatus();

                if (status === 'phone' || status === 'distracted') {
                    addTimelineEvent(`⚠️ Driver ${status} detected!`, true);
                }
                if (status === 'arrived' && !state.isArrived) {
                    triggerArrival();
                }
            }
        }, (error) => {
            console.error('Driver status listener error:', error);
        });

        // 4. ALERTS
        const alertsRef = ref(db, 'alerts');
        onValue(alertsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const entries = Object.entries(data);
                const latest = entries[entries.length - 1];
                if (latest) {
                    const alert = latest[1];
                    const message = alert.message || alert.type || 'New alert';
                    addTimelineEvent(`⚠️ ${message}`, true);

                    if (alert.type === 'arrival' || message.toLowerCase().includes('arriv')) {
                        triggerArrival();
                    }
                }
            }
        }, (error) => {
            console.error('Alerts listener error:', error);
        });

        // ============================================================
        // 🔄 REFRESH BUTTON
        // ============================================================
        dom.refreshBtn.addEventListener('click', () => {
            const icon = dom.refreshBtn.querySelector('i');
            icon.classList.add('fa-spin');
            dom.refreshBtn.disabled = true;
            addTimelineEvent('🔄 Manual refresh triggered');
            setTimeout(() => {
                icon.classList.remove('fa-spin');
                dom.refreshBtn.disabled = false;
                addTimelineEvent('✅ Refresh complete');
            }, 1500);
        });

        // ============================================================
        // 🎨 THEME TOGGLE EVENT
        // ============================================================
        dom.themeToggle.addEventListener('click', toggleTheme);

        // ============================================================
        // 🔒 LOGOUT EVENT
        // ============================================================
        if (dom.logoutBtn) {
            dom.logoutBtn.addEventListener('click', async () => {
                dom.logoutBtn.disabled = true;
                try {
                    await signOut(auth);
                    window.location.replace('login.html');
                } catch (err) {
                    console.error('Sign-out failed:', err);
                    dom.logoutBtn.disabled = false;
                }
            });
        }

        // ============================================================
        // 🚀 INIT
        // ============================================================
        function init() {
            loadTheme();
            addTimelineEvent('🚀 SAFAR system started');
            addTimelineEvent('📡 Firebase connected successfully');
            addTimelineEvent('👀 Waiting for bus data...');

            console.log('%c🚌 SAFAR - The Guardian Tracker',
                'font-family:Playfair Display,serif;font-size:24px;color:#6C5CE1;font-weight:900;');
            console.log('%c📡 Firebase Realtime Database connected',
                'font-family:Inter,sans-serif;font-size:12px;color:#00CEC9;');
            console.log(`%c👤 Project: ${firebaseConfig.projectId}`,
                'font-family:Inter,sans-serif;font-size:12px;color:#8A8AA8;');
        }

        // Start the app
        init();

        // ============================================================
        // 🛡️ ERROR HANDLING
        // ============================================================
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.message);
            addTimelineEvent(`⚠️ Error: ${e.message}`, true);
        });

        window.addEventListener('online', () => {
            addTimelineEvent('✅ Network connection restored');
            state.driverStatus = 'live';
            updateDriverStatus();
        });

        window.addEventListener('offline', () => {
            addTimelineEvent('⚠️ Network connection lost', true);
            state.driverStatus = 'offline';
            updateDriverStatus();
        });

        console.log('✅ SAFAR dashboard is production ready!');
        console.log('🗺️ Google Maps will load shortly...');
    </script>

</body>
</html>
