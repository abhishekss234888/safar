<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFAR - The Guardian Tracker</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <style>
        /* ============================================================
           DIVINE VARIABLES — THE COSMIC PALETTE
           ============================================================ */
        :root {
            --primary: #6C5CE7;
            --primary-light: #8B7CF7;
            --primary-dark: #4A3DB8;
            --primary-glow: rgba(108, 92, 231, 0.5);
            --primary-super-glow: rgba(108, 92, 231, 0.2);

            --secondary: #00CEC9;
            --secondary-glow: rgba(0, 206, 201, 0.4);

            --tertiary: #FD79A8;
            --tertiary-glow: rgba(253, 121, 168, 0.4);

            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #FF7675;

            /* Light Mode — Celestial */
            --bg-primary: #EDEAF6;
            --bg-secondary: #E4DFF2;
            --bg-tertiary: #F5F0FF;

            /* Liquid Glass */
            --surface: rgba(255, 255, 255, 0.22);
            --surface-hover: rgba(255, 255, 255, 0.48);
            --surface-active: rgba(255, 255, 255, 0.70);
            --surface-border: rgba(255, 255, 255, 0.50);
            --surface-border-glow: rgba(255, 255, 255, 0.80);

            /* Divine Shadows */
            --shadow-layer-1: 0 2px 8px -2px rgba(108, 92, 231, 0.04);
            --shadow-layer-2: 0 8px 32px -8px rgba(108, 92, 231, 0.08);
            --shadow-layer-3: 0 20px 64px -16px rgba(108, 92, 231, 0.12);
            --shadow-layer-4: 0 40px 96px -24px rgba(108, 92, 231, 0.16);
            --shadow-layer-5: 0 60px 128px -32px rgba(108, 92, 231, 0.08);
            --shadow-layer-6: inset 0 1px 0 rgba(255, 255, 255, 0.7);
            --shadow-layer-7: inset 0 -1px 0 rgba(255, 255, 255, 0.3);

            --text-primary: #14142A;
            --text-secondary: #4A4A6A;
            --text-tertiary: #6A6A8A;
            --text-muted: #9A9ABA;

            --ambient-1: rgba(108, 92, 231, 0.06);
            --ambient-2: rgba(0, 206, 201, 0.04);
            --ambient-3: rgba(253, 121, 168, 0.03);
            --ambient-4: rgba(253, 203, 110, 0.02);
            --ambient-5: rgba(108, 92, 231, 0.02);
            --ambient-6: rgba(0, 206, 201, 0.015);

            --card-radius: 36px;
            --inner-radius: 22px;
            --pill-radius: 50px;
            --gap: 18px;

            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;

            --scrollbar-thumb: #C0C0D8;
            --scrollbar-track: transparent;
        }

        /* Dark Mode */
        body.dark-mode {
            --bg-primary: #060812;
            --bg-secondary: #0A0D1A;
            --bg-tertiary: #0E1122;
            --surface: rgba(18, 22, 40, 0.35);
            --surface-hover: rgba(28, 33, 56, 0.60);
            --surface-active: rgba(38, 44, 68, 0.78);
            --surface-border: rgba(255, 255, 255, 0.05);
            --surface-border-glow: rgba(255, 255, 255, 0.12);
            --shadow-layer-1: 0 2px 8px -2px rgba(0, 0, 0, 0.3);
            --shadow-layer-2: 0 8px 32px -8px rgba(0, 0, 0, 0.4);
            --shadow-layer-3: 0 20px 64px -16px rgba(0, 0, 0, 0.5);
            --shadow-layer-4: 0 40px 96px -24px rgba(0, 0, 0, 0.6);
            --shadow-layer-5: 0 60px 128px -32px rgba(0, 0, 0, 0.3);
            --shadow-layer-6: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            --shadow-layer-7: inset 0 -1px 0 rgba(255, 255, 255, 0.01);
            --text-primary: #EAEAF4;
            --text-secondary: #B0B0CC;
            --text-tertiary: #8A8AAA;
            --text-muted: #6A6A8A;
            --ambient-1: rgba(108, 92, 231, 0.10);
            --ambient-2: rgba(0, 206, 201, 0.06);
            --ambient-3: rgba(253, 121, 168, 0.04);
            --ambient-4: rgba(253, 203, 110, 0.03);
            --ambient-5: rgba(108, 92, 231, 0.05);
            --ambient-6: rgba(0, 206, 201, 0.025);
            --scrollbar-thumb: #2A2A44;
        }

        /* ============================================================
           BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 14px 60px;
            transition: background 1s cubic-bezier(0.34, 1.56, 0.64, 1),
                color 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glow */
        body::before {
            content: '';
            position: fixed;
            inset: -60%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 10% 10%, var(--ambient-1) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 15%, var(--ambient-2) 0%, transparent 35%),
                radial-gradient(ellipse at 50% 90%, var(--ambient-3) 0%, transparent 40%),
                radial-gradient(ellipse at 15% 80%, var(--ambient-4) 0%, transparent 30%),
                radial-gradient(ellipse at 75% 40%, var(--ambient-5) 0%, transparent 45%),
                radial-gradient(ellipse at 30% 55%, var(--ambient-6) 0%, transparent 35%);
            pointer-events: none;
            transition: background 1.2s ease;
            animation: cosmicBreath 14s ease-in-out infinite;
        }

        @keyframes cosmicBreath {
            0%,
            100% {
                transform: scale(1) rotate(0deg) translate(0, 0);
                opacity: 1;
            }
            25% {
                transform: scale(1.04) rotate(0.8deg) translate(2%, -1%);
                opacity: 0.92;
            }
            50% {
                transform: scale(0.96) rotate(-0.6deg) translate(-1%, 2%);
                opacity: 0.88;
            }
            75% {
                transform: scale(1.02) rotate(0.4deg) translate(1%, -2%);
                opacity: 0.95;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 20px;
            box-shadow: 0 0 40px var(--primary-glow);
            transition: background 0.4s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ============================================================
           DASHBOARD
           ============================================================ */
        .dashboard {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        /* ============================================================
           LIQUID GLASS
           ============================================================ */
        .god-glass {
            backdrop-filter: blur(32px) saturate(2.6) contrast(1.35) brightness(1.12);
            -webkit-backdrop-filter: blur(32px) saturate(2.6) contrast(1.35) brightness(1.12);
            background: var(--surface);
            border: 1px solid var(--surface-border);
            box-shadow:
                var(--shadow-layer-1),
                var(--shadow-layer-2),
                var(--shadow-layer-3),
                var(--shadow-layer-4),
                var(--shadow-layer-5),
                var(--shadow-layer-6),
                var(--shadow-layer-7);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .god-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 85% 65%, rgba(255, 255, 255, 0.20) 0%, transparent 40%),
                radial-gradient(circle at 45% 92%, rgba(255, 255, 255, 0.10) 0%, transparent 30%),
                radial-gradient(circle at 70% 20%, rgba(108, 92, 231, 0.04) 0%, transparent 35%);
            mix-blend-mode: overlay;
            opacity: 0.75;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 1;
            animation: sheenDrift 12s ease-in-out infinite;
        }

        @keyframes sheenDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(2%, -1%) scale(1.02);
            }
            66% {
                transform: translate(-1%, 2%) scale(0.98);
            }
        }

        .god-glass::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: calc(var(--card-radius) - 2px);
            pointer-events: none;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.20) 0%,
                    transparent 25%,
                    transparent 65%,
                    rgba(255, 255, 255, 0.06) 85%,
                    rgba(255, 255, 255, 0.12) 100%);
            opacity: 0.5;
            transition: opacity 0.6s ease;
            z-index: 1;
        }

        .god-glass .chromatic-glow {
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--card-radius) + 2px);
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 206, 201, 0.03) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(253, 121, 168, 0.02) 0%, transparent 35%);
            opacity: 0.3;
            z-index: 0;
            transition: opacity 0.6s ease;
            filter: blur(8px);
        }

        .god-glass:hover {
            transform: translateY(-6px) scale(1.012) rotateX(0.5deg);
            background: var(--surface-hover);
            box-shadow:
                0 4px 16px -4px rgba(108, 92, 231, 0.10),
                0 16px 56px -12px rgba(108, 92, 231, 0.16),
                0 32px 88px -20px rgba(108, 92, 231, 0.12),
                0 56px 136px -28px rgba(108, 92, 231, 0.08),
                0 80px 180px -36px rgba(108, 92, 231, 0.04),
                var(--shadow-layer-6),
                var(--shadow-layer-7);
            border-color: var(--surface-border-glow);
        }

        .god-glass:hover::before {
            opacity: 1;
            transform: scale(1.04) translate(0, 0);
        }

        .god-glass:hover::after {
            opacity: 0.8;
        }

        .god-glass:hover .chromatic-glow {
            opacity: 0.6;
        }

        /* ============================================================
           GLASS CARD
           ============================================================ */
        .glass-card {
            border-radius: var(--card-radius);
            padding: 22px 24px;
            animation: divineReveal 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes divineReveal {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.92) rotateX(8deg);
                filter: blur(16px);
            }
            40% {
                transform: translateY(-8px) scale(1.018) rotateX(-2deg);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
                filter: blur(0);
            }
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            composes: god-glass;
            position: sticky;
            top: 14px;
            z-index: 50;
            border-radius: var(--card-radius);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: -0.03em;
            position: relative;
        }

        .header-brand i {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--tertiary), var(--primary));
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: divineShift 5s ease-in-out infinite;
        }

        @keyframes divineShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        .header-brand span {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--primary-super-glow);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ============================================================
           STATUS BADGE
           ============================================================ */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 12px;
            border-radius: var(--pill-radius);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(0, 184, 148, 0.08);
            color: var(--success);
            border: 1px solid rgba(0, 184, 148, 0.12);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.10) 0%, transparent 60%);
            pointer-events: none;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: livePulse 1.2s ease-in-out infinite;
            flex-shrink: 0;
            transition: background 0.4s ease;
            box-shadow: 0 0 30px var(--success);
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.1;
                transform: scale(0.3);
            }
        }

        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(2);
            -webkit-backdrop-filter: blur(24px) saturate(2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-layer-1), var(--shadow-layer-2);
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.50) 0%, transparent 55%);
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.15) rotate(15deg);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 60px var(--primary-glow), var(--shadow-layer-3), var(--shadow-layer-4);
        }

        .theme-toggle:active {
            transform: scale(0.90);
        }

        .theme-toggle:hover::before {
            opacity: 1;
        }

        /* ============================================================
           MAP CARD — LEAFLET + OPENSTREETMAP
           ============================================================ */
        .map-card {
            position: relative;
            padding: 0;
            height: 350px;
            border-radius: var(--card-radius);
            cursor: default;
            overflow: hidden;
            background: var(--bg-secondary);
            transition: background 0.8s ease;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: var(--card-radius);
            background: var(--bg-secondary);
        }

        /* Leaflet tiles: soften into dark mode, keep crisp edges */
        .leaflet-container {
            font-family: var(--font-body);
            background: var(--bg-secondary);
        }

        body.dark-mode .leaflet-tile-pane {
            filter: brightness(0.62) invert(1) contrast(0.9) hue-rotate(180deg) saturate(0.7);
            transition: filter 0.8s ease;
        }

        body:not(.dark-mode) .leaflet-tile-pane {
            filter: saturate(0.85) brightness(1.02);
        }

        /* Kill default Leaflet chrome so it doesn't fight our glass UI */
        .leaflet-control-attribution {
            background: var(--surface) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-muted) !important;
            border-radius: 8px 0 0 0;
            font-size: 0.6rem !important;
            padding: 2px 8px !important;
        }
        .leaflet-control-attribution a {
            color: var(--text-tertiary) !important;
        }

        /* Zoom controls, restyled to match the dashboard's glass language */
        .leaflet-control-zoom {
            border: 1px solid var(--surface-border) !important;
            border-radius: var(--inner-radius) !important;
            overflow: hidden;
            box-shadow: var(--shadow-layer-2), var(--shadow-layer-3) !important;
            backdrop-filter: blur(24px) saturate(2);
            -webkit-backdrop-filter: blur(24px) saturate(2);
            margin: 14px !important;
        }
        .leaflet-control-zoom a {
            background: var(--surface) !important;
            color: var(--text-primary) !important;
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            font-size: 1.1rem !important;
            border: none !important;
            transition: all 0.3s ease;
        }
        .leaflet-control-zoom a:first-child {
            border-bottom: 1px solid var(--surface-border) !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--surface-hover) !important;
            color: var(--primary) !important;
        }

        /* Live-location overlay pill, top-left of the map */
        .map-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .map-overlay-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px 7px 10px;
            border-radius: var(--pill-radius);
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(2);
            -webkit-backdrop-filter: blur(24px) saturate(2);
            border: 1px solid var(--surface-border);
            box-shadow: var(--shadow-layer-2);
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-secondary);
            width: fit-content;
        }

        .map-overlay-pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
            animation: livePulse 1.2s ease-in-out infinite;
            flex-shrink: 0;
        }

        .map-overlay-pill.gps-lost .dot {
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger);
            animation: none;
        }

        /* Center-on-bus control, bottom-right of the map */
        .locate-btn {
            position: absolute;
            bottom: 14px;
            right: 14px;
            z-index: 500;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--surface-border);
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(2);
            -webkit-backdrop-filter: blur(24px) saturate(2);
            box-shadow: var(--shadow-layer-2), var(--shadow-layer-3);
            color: var(--text-primary);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .locate-btn:hover {
            transform: scale(1.1);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--primary-glow), var(--shadow-layer-3);
        }
        .locate-btn:active {
            transform: scale(0.92);
        }
        .locate-btn.spinning i {
            animation: locateSpin 0.8s linear infinite;
        }
        @keyframes locateSpin {
            to { transform: rotate(360deg); }
        }

        /* Custom bus marker */
        .bus-marker {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bus-marker-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--primary-super-glow);
            animation: busMarkerPulse 2s ease-out infinite;
        }
        .bus-marker-core {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            border: 2.5px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 0 0 1px var(--primary), 0 4px 16px -2px rgba(108, 92, 231, 0.6), 0 0 24px var(--primary-glow);
        }
        @keyframes busMarkerPulse {
            0% {
                transform: scale(0.6);
                opacity: 0.55;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        /* ============================================================
           STATS ROW
           ============================================================ */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-card {
            composes: god-glass;
            border-radius: var(--card-radius);
            padding: 18px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .stat-card:hover {
            transform: translateY(-3px) scale(1.01);
            background: var(--surface-hover);
        }

        .stat-icon {
            font-size: 1.3rem;
            color: var(--primary);
            transition: color 0.4s ease;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            transition: all 0.3s ease;
            position: relative;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        /* ============================================================
           FOOTER ACTIONS
           ============================================================ */
        .footer-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            composes: god-glass;
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--pill-radius);
            border: 1px solid var(--surface-border);
            background: var(--surface);
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 800;
            font-size: 0.82rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-layer-1), var(--shadow-layer-2);
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.25) 0%, transparent 55%);
            pointer-events: none;
            opacity: 0.4;
            transition: opacity 0.4s ease;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.015);
            background: var(--surface-hover);
            box-shadow:
                0 12px 48px -12px rgba(108, 92, 231, 0.20),
                var(--shadow-layer-3),
                var(--shadow-layer-4);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn:hover::before {
            opacity: 0.8;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-color: var(--primary);
            box-shadow:
                0 8px 32px -8px rgba(108, 92, 231, 0.4),
                var(--shadow-layer-3);
        }

        .btn-primary::before {
            background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.30) 0%, transparent 55%);
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #5B4BD4, #4A3DB8);
            color: #fff;
            border-color: #5B4BD4;
            box-shadow:
                0 12px 48px -12px rgba(108, 92, 231, 0.5),
                var(--shadow-layer-4);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 480px) {
            .dashboard {
                max-width: 480px;
            }
            .map-card {
                height: 350px;
            }
            .stat-value {
                font-size: 2.2rem;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 36px 24px 70px;
            }
            .dashboard {
                max-width: 540px;
                gap: 20px;
            }
            .map-card {
                height: 380px;
            }
            .stat-card {
                padding: 22px 18px;
            }
            .stat-value {
                font-size: 2.4rem;
            }
        }

        @media (min-width: 1024px) {
            .dashboard {
                max-width: 580px;
            }
            .map-card {
                height: 420px;
            }
            .stat-value {
                font-size: 2.6rem;
            }
            .header-brand {
                font-size: 1.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .btn:focus-visible,
        .theme-toggle:focus-visible {
            outline: 4px solid var(--primary);
            outline-offset: 6px;
        }

        .hidden {
            display: none !important;
        }

        .stats-row-single {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* ============================================================
           🔒 AUTH GATE — content stays hidden until Firebase confirms
           the visitor is signed in. See the module script below for
           the check (onAuthStateChanged) and the redirect to login.html.
           ============================================================ */
        body:not(.authed) .dashboard {
            display: none;
        }

        #authGate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            transition: opacity .35s ease;
        }
        body.authed #authGate {
            opacity: 0;
            pointer-events: none;
        }
        .auth-gate-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid var(--surface-border);
            border-top-color: var(--primary);
            animation: authGateSpin .8s linear infinite;
        }
        @keyframes authGateSpin {
            to { transform: rotate(360deg); }
        }
        .auth-gate-text {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: .2px;
            color: var(--text-tertiary);
        }
        .logout-btn {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    🔒 AUTH GATE — shown until Firebase confirms a signed-in user.
    The dashboard below is hidden by CSS until <body> gets the
    "authed" class from the script at the bottom of this file.
    ============================================================ -->
    <div id="authGate" aria-live="polite">
        <div class="auth-gate-spinner" aria-hidden="true"></div>
        <div class="auth-gate-text" id="authGateText">Checking your session…</div>
    </div>

    <!-- ============================================================
    DASHBOARD
    ============================================================ -->
    <main class="dashboard" role="main" aria-label="GPS Tracker Dashboard">

        <!-- HEADER -->
        <header class="header" role="banner">
            <div class="header-brand">
                <i class="fa-solid fa-shield-halved"></i>
                <span>SAFAR</span>
            </div>
            <div class="header-actions">
                <div class="status-badge" id="statusBadge" aria-live="polite">
                    <span class="live-dot"></span>
                    <span id="statusText">Live</span>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <button class="theme-toggle logout-btn" id="logoutBtn" aria-label="Sign out" title="Sign out">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- MAP CARD — LEAFLET + OPENSTREETMAP -->
        <section class="map-card god-glass" id="mapCard" aria-label="Live map view" style="animation-delay:0.03s;">
            <div class="chromatic-glow"></div>
            <div id="map"></div>
            <div class="map-overlay">
                <div class="map-overlay-pill" id="mapOverlayPill">
                    <span class="dot"></span>
                    <span>Live Location</span>
                </div>
            </div>
            <button class="locate-btn" id="locateBtn" aria-label="Center map on bus" title="Center on bus">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </section>

        <!-- STATS -->
        <div class="stats-row-single" aria-label="Key statistics">
            <div class="stat-card" id="speedCard" aria-label="Current speed">
                <i class="fa-solid fa-gauge-high stat-icon"></i>
                <span class="stat-value" id="speedValue">0</span>
                <span class="stat-label">Speed (mph)</span>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer-actions">
            <button class="btn btn-primary" id="refreshBtn" aria-label="Refresh tracker data">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>

    </main>

    <!-- ============================================================
    LEAFLET.JS — OPENSTREETMAP RENDERER
    ============================================================ -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- ============================================================
    JAVASCRIPT — PRODUCTION READY
    ============================================================ -->
    <script type="module">
        // ============================================================
        // 🔥 FIREBASE IMPORTS
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // ============================================================
        // 📝 FIREBASE CONFIG — COMPLETE
        // ====================================
        const firebaseConfig = {
            apiKey: "AIzaSyAYmzDU0aAlRsnICNYvWFBgnrd2pb6EegA",
            authDomain: "safar456.firebaseapp.com",
            databaseURL: "https://safar456-default-rtdb.firebaseio.com",
            projectId: "safar456",
            storageBucket: "safar456.firebasestorage.app",
            messagingSenderId: "59056822262",
            appId: "1:59056822262:web:98c1f9dfe5b36929d1d9d7",
            measurementId: "G-8P3202TJZ4",
        };

        // ============================================================
        // 🚀 INITIALIZE FIREBASE
        // ============================================================
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        console.log("🔥 Firebase connected successfully!");

        // ============================================================
        // 🔒 AUTH GATE — this page's content is hidden (see CSS) until
        // Firebase confirms someone is signed in. Anyone without a
        // session gets bounced back to login.html.
        // ============================================================
        const authGateText = document.getElementById('authGateText');
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.body.classList.add('authed');
            } else {
                if (authGateText) authGateText.textContent = 'Redirecting to login…';
                window.location.replace('index.html');
            }
        });

        // ============================================================
        // 📊 STATE
        // ============================================================
        const state = {
            latitude: 0,
            longitude: 0,
            speedMph: 0,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);
        const dom = {
            statusBadge: $('statusBadge'),
            statusText: $('statusText'),
            themeToggle: $('themeToggle'),
            themeIcon: $('themeIcon'),
            speedValue: $('speedValue'),
            speedCard: $('speedCard'),
            refreshBtn: $('refreshBtn'),
            logoutBtn: $('logoutBtn'),
            locateBtn: $('locateBtn'),
            mapOverlayPill: $('mapOverlayPill'),
        };

        // ============================================================
        // 🗺️ LEAFLET + OPENSTREETMAP
        // ============================================================
        let map;
        let marker;
        let mapInitialized = false;
        let hasCenteredOnce = false;

        const DEFAULT_LOCATION = { lat: 8.49, lng: 76.95 };

        // Custom bus icon — a glowing, pulsing circular marker instead
        // of Leaflet's default pin.
        const busIcon = L.divIcon({
            className: 'bus-marker',
            html: `
                <div class="bus-marker-ring"></div>
                <div class="bus-marker-core"><i class="fa-solid fa-bus"></i></div>
            `,
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        function initMap() {
            map = L.map('map', {
                center: [DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lng],
                zoom: 14,
                zoomControl: true,
                attributionControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            marker = L.marker([DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lng], {
                icon: busIcon,
                title: 'Bus Location'
            }).addTo(map);

            mapInitialized = true;
            console.log('🗺️ Leaflet map initialized with OpenStreetMap tiles');
        }

        // ============================================================
        // 📍 UPDATE MAP LOCATION
        // ============================================================
        function isValidCoordinate(lat, lng) {
            return typeof lat === 'number' && typeof lng === 'number' &&
                Number.isFinite(lat) && Number.isFinite(lng) &&
                lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
        }

        function updateMapLocation(lat, lng) {
            if (!mapInitialized || !map || !marker || !isValidCoordinate(lat, lng)) return;

            const position = [lat, lng];
            marker.setLatLng(position);

            if (!hasCenteredOnce) {
                map.setView(position, 15, { animate: true });
                hasCenteredOnce = true;
            } else {
                map.panTo(position, { animate: true, duration: 0.8 });
            }

            if (dom.mapOverlayPill) dom.mapOverlayPill.classList.remove('gps-lost');
        }

        // ============================================================
        // 🎯 CENTER-ON-BUS CONTROL
        // ============================================================
        function centerOnBus() {
            if (!mapInitialized || !map) return;
            dom.locateBtn.classList.add('spinning');

            if (isValidCoordinate(state.latitude, state.longitude)) {
                map.flyTo([state.latitude, state.longitude], 16, { animate: true, duration: 1.2 });
            } else {
                map.flyTo([DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lng], 14, { animate: true, duration: 1.2 });
            }

            setTimeout(() => dom.locateBtn.classList.remove('spinning'), 900);
        }

        // ============================================================
        // 🌓 THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            dom.themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('safar-theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const saved = localStorage.getItem('safar-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved === 'dark' || (!saved && prefersDark);
            if (isDark) {
                document.body.classList.add('dark-mode');
                dom.themeIcon.className = 'fa-solid fa-sun';
            }
        }

        // ============================================================
        // 📡 FIREBASE REAL-TIME LISTENERS
        // ============================================================

        // 1. BUS LOCATION
        const locationRef = ref(db, 'bus/currentLocation');
        onValue(locationRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const lat = typeof data.lat === 'number' ? data.lat : parseFloat(data.lat);
            const lng = typeof data.lng === 'number' ? data.lng : parseFloat(data.lng);

            if (!isValidCoordinate(lat, lng)) {
                console.warn('Ignored invalid GPS reading:', data);
                return;
            }

            state.latitude = lat;
            state.longitude = lng;
            updateMapLocation(lat, lng);
        }, (error) => {
            console.error('Location listener error:', error);
            if (dom.mapOverlayPill) dom.mapOverlayPill.classList.add('gps-lost');
        });

        // 2. BUS SPEED
        const speedRef = ref(db, 'bus/speed');
        onValue(speedRef, (snapshot) => {
            const speed = snapshot.val();
            if (speed !== null && speed !== undefined) {
                state.speedMph = typeof speed === 'number' ? speed : parseFloat(speed) || 0;
                dom.speedValue.textContent = Math.round(state.speedMph);

                if (state.speedMph > 65) {
                    dom.speedCard.classList.add('warning-flash');
                    setTimeout(() => dom.speedCard.classList.remove('warning-flash'), 2000);
                }
            }
        }, (error) => {
            console.error('Speed listener error:', error);
        });

        // ============================================================
        // 🎯 LOCATE BUS BUTTON
        // ============================================================
        if (dom.locateBtn) {
            dom.locateBtn.addEventListener('click', centerOnBus);
        }

        // ============================================================
        // 🔄 REFRESH BUTTON
        // ============================================================
        dom.refreshBtn.addEventListener('click', () => {
            const icon = dom.refreshBtn.querySelector('i');
            icon.classList.add('fa-spin');
            dom.refreshBtn.disabled = true;
            setTimeout(() => {
                icon.classList.remove('fa-spin');
                dom.refreshBtn.disabled = false;
            }, 1500);
        });

        // ============================================================
        // 🎨 THEME TOGGLE EVENT
        // ============================================================
        dom.themeToggle.addEventListener('click', toggleTheme);

        // ============================================================
        // 🔒 LOGOUT EVENT
        // ============================================================
        if (dom.logoutBtn) {
            dom.logoutBtn.addEventListener('click', async () => {
                dom.logoutBtn.disabled = true;
                try {
                    await signOut(auth);
                    window.location.replace('index.html');
                } catch (err) {
                    console.error('Sign-out failed:', err);
                    dom.logoutBtn.disabled = false;
                }
            });
        }

        // ============================================================
        // 🚀 INIT
        // ============================================================
        function init() {
            loadTheme();
            initMap();

            console.log('%c🚌 SAFAR - The Guardian Tracker',
                'font-family:Playfair Display,serif;font-size:24px;color:#6C5CE1;font-weight:900;');
            console.log('%c📡 Firebase Realtime Database connected',
                'font-family:Inter,sans-serif;font-size:12px;color:#00CEC9;');
            console.log(`%c👤 Project: ${firebaseConfig.projectId}`,
                'font-family:Inter,sans-serif;font-size:12px;color:#8A8AA8;');
        }

        // Start the app
        init();

        // ============================================================
        // 🛡️ ERROR HANDLING
        // ============================================================
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.message);
        });

        console.log('✅ SAFAR dashboard is production ready!');
    </script>

</body>
</html>
