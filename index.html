  .bg-orb{
    position:absolute; border-radius:50%;
    filter:blur(56px); opacity:0.5; mix-blend-mode:screen; will-change:transform;
  }
  .bg-orb.o1{
    width:clamp(220px,38vw,440px); height:clamp(220px,38vw,440px);
    top:-8%; right:-8%;
    background:radial-gradient(circle, rgba(120,190,255,0.85), transparent 70%);
    animation:drift1 9s ease-in-out infinite;
  }
  .bg-orb.o2{
    width:clamp(200px,32vw,340px); height:clamp(200px,32vw,340px);
    bottom:-8%; left:-4%;
    background:radial-gradient(circle, rgba(170,130,255,0.75), transparent 70%);
    animation:drift2 11s ease-in-out infinite;
  }
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-24px,24px,0) scale(1.08);}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(20px,-20px,0) scale(1.06);}}
  @media (prefers-reduced-motion: reduce){ .bg-orb{animation:none;} }

  /* ---------- layout (works on any screen size) ---------- */
  .wrap{
    position:relative; z-index:1;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  /* ---------- glass card (no bright border lines) ---------- */
  .glass-card{
    width:100%;
    max-width:400px;
    padding:clamp(26px,6vw,40px) clamp(20px,6vw,36px) clamp(24px,5vw,34px);
    border-radius:clamp(20px,5vw,28px);
    background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(22px) saturate(170%);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
    box-shadow:0 28px 70px -26px rgba(0,0,0,0.6);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass-card{background:rgba(24,30,52,0.82);}
  }

  h1{
    font-family:'Manrope',system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(21px,5.6vw,27px);
    line-height:1.2;
    margin:0 0 8px;
    text-align:center;
    color:#fff;
    text-wrap:balance;
  }
  .sub-tag{
    margin:0 0 clamp(22px,5vw,30px);
    text-align:center;
    font-weight:500;
    font-size:clamp(13px,3.6vw,14px);
    letter-spacing:0.3px;
    color:var(--text-dim);
  }

  form{display:flex; flex-direction:column; gap:clamp(16px,4vw,20px);}
  .field label{
    display:block; font-size:12.5px; font-weight:600; color:var(--text-dim);
    margin-bottom:8px; letter-spacing:0.3px;
  }
  .glass-input{
    display:flex; align-items:center; gap:10px;
    min-height:50px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:14px;
    padding:0 12px 0 14px;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .glass-input:focus-within{
    border-color:rgba(255,255,255,0.45);
    background:rgba(255,255,255,0.10);
    box-shadow:0 0 0 4px rgba(90,168,255,0.18);
  }
  .glass-input > svg{flex-shrink:0; opacity:0.75; color:#fff;}
  .glass-input input{
    flex:1; min-width:0; width:100%;
    background:transparent !important; border:none;
    color:#fff; caret-color:#fff;
    font-size:16px;              /* 16px stops iOS from zooming on focus */
    padding:13px 0;
  }
  .glass-input input::placeholder{color:rgba(255,255,255,0.42);}
  .glass-input input:-webkit-autofill,
  .glass-input input:-webkit-autofill:hover,
  .glass-input input:-webkit-autofill:focus{
    -webkit-text-fill-color:#fff;
    -webkit-box-shadow:0 0 0 1000px rgba(20,26,48,0.9) inset;
    transition:background-color 9999s ease-in-out 0s;
    caret-color:#fff;
  }

  .toggle-vis{
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:10px; color:var(--text-dim); cursor:pointer; padding:0;
    transition:color .12s, background .12s, border-color .12s;
  }
  .toggle-vis:hover{color:#fff; background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.3);}
  .toggle-vis:focus-visible, .btn-glass:focus-visible{box-shadow:0 0 0 3px rgba(90,168,255,0.45);}
  .toggle-vis svg{display:block;}
  .toggle-vis .eye-off{display:none;}
  .toggle-vis.is-visible .eye-on{display:none;}
  .toggle-vis.is-visible .eye-off{display:block;}

  button.btn-glass{
    margin-top:6px; width:100%; min-height:52px; padding:14px;
    border-radius:14px; border:1px solid rgba(255,255,255,0.26);
    background:linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    color:#fff; font-family:'Manrope',system-ui,sans-serif;
    font-size:15.5px; font-weight:700; letter-spacing:0.3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 12px 28px -16px rgba(90,168,255,0.45);
    transition:transform .08s, filter .12s, background .12s;
  }
  button.btn-glass:hover{filter:brightness(1.12); background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));}
  button.btn-glass:active{transform:translateY(1px) scale(0.99);}
  button.btn-glass svg{transition:transform .12s;}
  button.btn-glass:hover svg{transform:translateX(3px);}
  button.btn-glass:disabled{cursor:default; filter:none; opacity:0.75;}

  .form-error{
    display:none; align-items:flex-start; gap:8px;
    background:rgba(255,90,90,0.13); border:1px solid rgba(255,120,120,0.35);
    color:#ffd7d7; font-size:13px; font-weight:500; line-height:1.4;
    padding:10px 12px; border-radius:10px; overflow-wrap:anywhere;
  }
  .form-error.show{display:flex;}
  .form-error svg{flex-shrink:0; margin-top:2px;}
  .field.has-error .glass-input{border-color:rgba(255,120,120,0.55); box-shadow:0 0 0 4px rgba(255,90,90,0.12);}

  /* ---------- screen-size tuning ---------- */
  @media (min-width:1200px){
    .glass-card{max-width:420px;}
  }
  @media (min-width:1800px){
    .glass-card{max-width:460px;}
    h1{font-size:30px;}
    .glass-input input{font-size:17px;}
  }
  @media (max-width:340px){
    .glass-card{padding-left:16px; padding-right:16px;}
    .glass-input{padding-left:12px; padding-right:8px;}
  }
  /* phones held sideways / very short windows: keep top aligned and scrollable */
  @media (max-height:560px){
    .wrap{align-items:flex-start;}
    .glass-card{margin:auto 0;}
    h1{margin-bottom:4px;}
    .sub-tag{margin-bottom:16px;}
    form{gap:12px;}
    .glass-input{min-height:46px;}
    button.btn-glass{min-height:48px;}
  }
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-photo"></div>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
</div>

<main class="wrap">
  <div class="glass-card">
    <h1>The journey begins here!</h1>
    <h3 class="sub-tag">Welcome to Safar</h3>

    <form id="loginForm" method="post" action="#" autocomplete="off" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="glass-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="username" name="username" type="email" inputmode="email" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="glass-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          <button type="button" class="toggle-vis" id="toggleVis" aria-label="Show password">
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.4-4.7 6.4-7.5 10-7.5s7.6 2.8 10 7.5c-2.4 4.7-6.4 7.5-10 7.5S4.4 16.7 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5l17 17"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 4.5c3.6 0 7.6 2.8 10 7.5-.8 1.55-1.8 2.9-2.9 4M6.5 6.5C4.6 7.9 3 9.7 2 12c2.4 4.7 6.4 7.5 10 7.5 1.4 0 2.75-.4 4-1.1"/><path d="M9.9 10c-.35.55-.55 1.25-.55 2 0 1.93 1.57 3.5 3.5 3.5.75 0 1.45-.2 2-.55"/></svg>
          </button>
        </div>
      </div>

      <div class="form-error" id="loginError" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginErrorText">Something went wrong.</span>
      </div>

      <button type="submit" class="btn-glass" id="loginBtn">
        Login
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ---------- elements ----------
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('loginBtn');
  var usernameField = document.getElementById('username');
  var passwordField = document.getElementById('password');
  var toggle = document.getElementById('toggleVis');
  var errorBox = document.getElementById('loginError');
  var errorText = document.getElementById('loginErrorText');
  var btnOriginal = btn.innerHTML;

  // ---------- show / hide password ----------
  toggle.addEventListener('mousedown', function (e) { e.preventDefault(); });
  toggle.addEventListener('click', function () {
    var show = passwordField.type === 'password';
    var pos = passwordField.selectionStart;
    passwordField.type = show ? 'text' : 'password';
    toggle.classList.toggle('is-visible', show);
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    passwordField.focus();
    try { passwordField.setSelectionRange(pos, pos); } catch (e) {}
  });

  // ---------- error helpers ----------
  function showError(message) {
    errorText.textContent = message;
    errorBox.classList.add('show');
    usernameField.closest('.field').classList.add('has-error');
    passwordField.closest('.field').classList.add('has-error');
  }
  function clearError() {
    errorBox.classList.remove('show');
    usernameField.closest('.field').classList.remove('has-error');
    passwordField.closest('.field').classList.remove('has-error');
  }
  function friendlyError(code) {
    switch (code) {
      case 'auth/invalid-email': return 'Enter a valid email address in the username field.';
      case 'auth/user-not-found':
      case 'auth/invalid-credential':
      case 'auth/wrong-password': return 'Incorrect username or password.';
      case 'auth/too-many-requests': return 'Too many attempts. Please wait a moment and try again.';
      case 'auth/network-request-failed': return 'Network error \u2014 check your connection and try again.';
      case 'auth/operation-not-allowed': return 'Email/Password sign-in isn\u2019t enabled yet in Firebase Console.';
      case 'auth/operation-not-supported-in-this-environment': return 'Open this page from http://localhost or your hosting URL, not as a local file.';
      case 'auth/unauthorized-domain': return 'This domain is not authorized in Firebase Console (Authentication \u2192 Settings \u2192 Authorized domains).';
      default: return 'Sign-in failed. Please try again.';
    }
  }

  // ---------- Firebase (loaded safely so the page never breaks if it fails) ----------
  var ADMIN_EMAIL = 'admin@safar.com';
  var firebaseConfig = {
    apiKey: "AIzaSyAYmzDU0aAlRsnICNYvWFBgnrd2pb6EegA",
    authDomain: "safar456.firebaseapp.com",
    databaseURL: "https://safar456-default-rtdb.firebaseio.com",
    projectId: "safar456",
    storageBucket: "safar456.firebasestorage.app",
    messagingSenderId: "59056822262",
    appId: "1:59056822262:web:98c1f9dfe5b36929d1d9d7",
    measurementId: "G-8P3202TJZ4"
  };
  // tries several SDK versions in case one isn't reachable from the host
  var SDK_VERSIONS = ["12.17.1", "12.19.0", "11.10.0"];
  var redirected = false;
  var loadError = '';

  function goToDashboard(user) {
    if (redirected) return;
    redirected = true;
    var email = String(user.email || '').trim().toLowerCase();
    window.location.replace(email === ADMIN_EMAIL ? 'admin-dashboard.html' : 'dashboard.html');
  }

  var fbReady = (async function () {
    var lastErr;
    for (var i = 0; i < SDK_VERSIONS.length; i++) {
      var base = "https://www.gstatic.com/firebasejs/" + SDK_VERSIONS[i] + "/";
      try {
        var appMod = await import(base + "firebase-app.js");
        var authMod = await import(base + "firebase-auth.js");
        var app = appMod.initializeApp(firebaseConfig);
        var auth = authMod.getAuth(app);
        // the ONLY place that redirects
        authMod.onAuthStateChanged(auth, function (user) { if (user) goToDashboard(user); });
        return { auth: auth, mod: authMod };
      } catch (err) {
        lastErr = err;
        console.warn('Firebase ' + SDK_VERSIONS[i] + ' failed to load:', err);
      }
    }
    loadError = String(lastErr && lastErr.message || lastErr || 'unknown error');
    throw lastErr;
  })();
  fbReady.catch(function (err) { console.error('Firebase failed to load:', err); });

  // ---------- login submit ----------
  form.addEventListener('submit', async function (e) {
    e.preventDefault();               // never let credentials go into the URL
    clearError();

    var email = usernameField.value.trim();
    var password = passwordField.value;
    if (!email || !password) { showError('Please fill in both fields.'); return; }

    btn.disabled = true;
    btn.innerHTML = 'Signing in\u2026';

    try {
      var fb = await fbReady;
      await fb.mod.setPersistence(fb.auth, fb.mod.browserLocalPersistence);
      await fb.mod.signInWithEmailAndPassword(fb.auth, email, password);
      btn.innerHTML = 'Success \u2014 redirecting\u2026';   // onAuthStateChanged redirects
    } catch (err) {
      console.error(err);
      showError(err && err.code ? friendlyError(err.code)
        : 'Could not load Firebase (' + (loadError || (err && err.message) || 'unknown') + '). Disable ad blockers/VPN, check Vercel headers (CSP), then press F12 \u2192 Console for details.');
      btn.disabled = false;
      btn.innerHTML = btnOriginal;
    }
  });
})();
</script>

</body>
</html>
