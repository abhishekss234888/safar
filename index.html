<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login to Safari</title>

<style>
  :root{
    --text:#f4f6fa;
    --text-dim:rgba(244,246,250,0.65);
    --glass-bg:rgba(255,255,255,0.10);
    --glass-bg-strong:rgba(255,255,255,0.16);
    --glass-border:rgba(255,255,255,0.30);
    --glass-border-soft:rgba(255,255,255,0.14);
    --blue:#5aa8ff;
  }
  *{box-sizing:border-box;}
  *{
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-overflow-scrolling:touch;
    touch-action:manipulation;
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    background:#0a0d13;
  }
  a, button, input, .glass-input, .toggle-vis, .btn-glass{
    outline:none;
    -webkit-tap-highlight-color:transparent;
  }
  a:focus, button:focus, input:focus, .toggle-vis:focus{
    outline:none;
  }
  ::selection{
    background:rgba(90,168,255,0.35);
    color:#fff;
  }

    will-change:transform;
    transform:translateZ(0);

    animation:drift3 8s cubic-bezier(0.45,0,0.55,1) infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(-30px,30px,0) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(25px,-25px,0) scale(1.06); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate3d(-20px,-10px,0) scale(0.95); }
    50%{ transform:translate3d(20px,15px,0) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce){
    .bg-orb{animation:none;}
  }

  /* ---------- layout ---------- */
  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---------- liquid glass card ---------- */
  .glass-card-outer{
    position:relative;
    padding:1.5px;
    border-radius:28px;
    background:conic-gradient(from 180deg at 50% 50%,
      rgba(255,255,255,0.65),
      rgba(120,190,255,0.35) 25%,
      rgba(255,255,255,0.15) 50%,
      rgba(190,140,255,0.4) 75%,
      rgba(255,255,255,0.65));
    box-shadow:0 30px 80px -24px rgba(0,0,0,0.5);
    animation:float 4s cubic-bezier(0.45,0,0.55,1) infinite;
    will-change:transform;
    transform:translateZ(0);
    backface-visibility:hidden;
  }
  @keyframes float{
    0%,100%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(0,-8px,0); }
  }
  .glass-card{
    width:100%;
    max-width:380px;
    padding:38px 34px 32px;
    border-radius:26.5px;
    background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.16);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 0 60px rgba(255,255,255,0.04),
      inset 0 -20px 40px rgba(120,160,255,0.05);
    position:relative;
    transform:translateZ(0);
    backface-visibility:hidden;
    overflow:hidden;
  }
  /* soft moving sheen across the glass */
  .glass-card::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:linear-gradient(120deg, transparent 42%, rgba(255,255,255,0.08) 47%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0.08) 53%, transparent 58%);
    animation:sheen 5s cubic-bezier(0.45,0,0.55,1) infinite;
    pointer-events:none;
    will-change:transform;
    transform:translate3d(-18%,-12%,0) rotate(8deg);
    backface-visibility:hidden;
  }
  @keyframes sheen{
    0%{ transform:translate3d(-18%,-12%,0) rotate(8deg); }
    50%{ transform:translate3d(12%,10%,0) rotate(8deg); }
    100%{ transform:translate3d(-18%,-12%,0) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .glass-card::before{animation:none;}
    .glass-card-outer{animation:none;}
  }

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:24px;
    margin:0 0 6px;
    text-align:center;
    color:#fff;
    position:relative;
  }
  .sub{
    text-align:center;
    font-size:13.5px;
    color:var(--text-dim);
    margin:0 0 30px;
    position:relative;
  }
  .sub-tag{
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13.5px;
    letter-spacing:0.3px;
    color:var(--text-dim);
    margin:0 0 30px;
    position:relative;
  }

  form{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-dim);
    margin-bottom:8px;
    letter-spacing:0.3px;
  }
  .glass-input{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    padding:0 14px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:border-color .12s cubic-bezier(0.4,0,0.2,1), background .12s cubic-bezier(0.4,0,0.2,1), box-shadow .12s cubic-bezier(0.4,0,0.2,1);
  }
  .glass-input:focus-within{
    border-color:rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.10);
    box-shadow:0 0 0 4px rgba(90,168,255,0.15);
  }
  .glass-input svg{
    flex-shrink:0;
    opacity:0.7;
    color:#fff;
  }
  .glass-input input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:14.5px;
    padding:13px 0;
    font-family:'Inter',sans-serif;
  }
  .glass-input input::placeholder{color:rgba(255,255,255,0.4);}
  .glass-input input:-webkit-autofill,
  .glass-input input:-webkit-autofill:hover,
  .glass-input input:-webkit-autofill:focus,
  .glass-input input:-webkit-autofill:active{
    -webkit-text-fill-color:#fff;
    -webkit-box-shadow:0 0 0px 1000px rgba(255,255,255,0.02) inset;
    box-shadow:0 0 0px 1000px rgba(255,255,255,0.02) inset;
    transition:background-color 9999s ease-in-out 0s, -webkit-text-fill-color 9999s ease-in-out 0s;
    caret-color:#fff;
  }
  .glass-input input{
    caret-color:#fff;
    background-color:transparent !important;
  }
  .glass-input input:active,
  .glass-input input:focus{
    background-color:transparent !important;
  }
  .toggle-vis{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:8px;
    color:var(--text-dim);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:color .1s cubic-bezier(0.4,0,0.2,1), background .1s cubic-bezier(0.4,0,0.2,1), border-color .1s cubic-bezier(0.4,0,0.2,1);
  }
  .toggle-vis:hover{
    color:#fff;
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.3);
  }
  .toggle-vis svg{display:block;}
  .toggle-vis .eye-off{display:none;}
  .toggle-vis.is-visible .eye-on{display:none;}
  .toggle-vis.is-visible .eye-off{display:block;}

  /* glass button */
  button.btn-glass{
    margin-top:10px;
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.28);
    background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    box-shadow:
      0 12px 30px -14px rgba(90,168,255,0.35),
      inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .06s cubic-bezier(0.4,0,0.2,1), box-shadow .1s cubic-bezier(0.4,0,0.2,1), filter .1s cubic-bezier(0.4,0,0.2,1), background .1s cubic-bezier(0.4,0,0.2,1);
    will-change:transform;
  }
  button.btn-glass:hover{
    filter:brightness(1.1);
    background:linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.07));
    box-shadow:0 16px 36px -14px rgba(90,168,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  button.btn-glass:active{transform:translateY(1px) scale(0.99);}
  button.btn-glass svg{transition:transform .1s cubic-bezier(0.4,0,0.2,1);}
  button.btn-glass:hover svg{transform:translateX(3px);}
  button.btn-glass:disabled{cursor:default; filter:none; opacity:0.75;}

  /* ---------- auth feedback ---------- */
  .form-error{
    display:none;
    align-items:center;
    gap:8px;
    background:rgba(255,90,90,0.12);
    border:1px solid rgba(255,120,120,0.35);
    color:#ffd7d7;
    font-size:12.5px;
    font-weight:500;
    line-height:1.4;
    padding:10px 12px;
    border-radius:10px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .form-error.show{display:flex;}
  .form-error svg{flex-shrink:0;}
  .field.has-error .glass-input{
    border-color:rgba(255,120,120,0.55);
    box-shadow:0 0 0 4px rgba(255,90,90,0.12);
  }

</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-photo"></div>
  <div class="bg-bend"></div>
  <div class="bg-crease"></div>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>
  <div class="bg-overlay"></div>
</div>

<div class="wrap">
  <div class="glass-card-outer">
  <div class="glass-card">
    <h1>The journey begins here!</h1>
    <h3 class="sub-tag">Welcome to Safar</h3>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <div class="glass-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="glass-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="toggle-vis" id="toggleVis" aria-label="Show password">
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.4-4.7 6.4-7.5 10-7.5s7.6 2.8 10 7.5c-2.4 4.7-6.4 7.5-10 7.5S4.4 16.7 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5l17 17"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 4.5c3.6 0 7.6 2.8 10 7.5-.8 1.55-1.8 2.9-2.9 4M6.5 6.5C4.6 7.9 3 9.7 2 12c2.4 4.7 6.4 7.5 10 7.5 1.4 0 2.75-.4 4-1.1"/><path d="M9.9 10c-.35.55-.55 1.25-.55 2 0 1.93 1.57 3.5 3.5 3.5.75 0 1.45-.2 2-.55"/></svg>
          </button>
        </div>
      </div>

      <div class="form-error" id="loginError" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginErrorText">Something went wrong.</span>
      </div>

      <button type="submit" class="btn-glass" id="loginBtn">
        Login
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
  </div>
</div>
<script type="module">
  // ============================================================
  // 🔥 FIREBASE — ADD / CONFIRM YOUR CREDENTIALS HERE
  // ============================================================
  // Example account: user@safar.app
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAYmzDU0aAlRsnICNYvWFBgnrd2pb6EegA",
    authDomain: "safar456.firebaseapp.com",
    databaseURL: "https://safar456-default-rtdb.firebaseio.com",
    projectId: "safar456",
    storageBucket: "safar456.firebasestorage.app",
    messagingSenderId: "59056822262",
    appId: "1:59056822262:web:98c1f9dfe5b36929d1d9d7",
    measurementId: "G-8P3202TJZ4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // If someone already has a live session, skip straight to the app.
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.replace('dashboard.html');
  });

  // ---------------- password visibility toggle (unchanged) ----------------
  const pwd = document.getElementById('password');
  const toggle = document.getElementById('toggleVis');
  toggle.addEventListener('click', () => {
    const isPw = pwd.type === 'password';
    pwd.type = isPw ? 'text' : 'password';
    toggle.classList.toggle('is-visible', isPw);
    toggle.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
  });

  // ---------------- login submit ----------------
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const usernameField = document.getElementById('username');
  const passwordField = document.getElementById('password');
  const errorBox = document.getElementById('loginError');
  const errorText = document.getElementById('loginErrorText');
  const btnOriginal = btn.innerHTML;

  function showError(message) {
    errorText.textContent = message;
    errorBox.classList.add('show');
    usernameField.closest('.field').classList.add('has-error');
    passwordField.closest('.field').classList.add('has-error');
  }

  function clearError() {
    errorBox.classList.remove('show');
    usernameField.closest('.field').classList.remove('has-error');
    passwordField.closest('.field').classList.remove('has-error');
  }

  function friendlyError(code) {
    switch (code) {
      case 'auth/invalid-email':
        return 'Enter a valid email address in the username field.';
      case 'auth/user-not-found':
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
        return 'Incorrect username or password.';
      case 'auth/too-many-requests':
        return 'Too many attempts. Please wait a moment and try again.';
      case 'auth/network-request-failed':
        return 'Network error — check your connection and try again.';
      case 'auth/operation-not-allowed':
        return 'Email/Password sign-in isn\u2019t enabled yet in Firebase Console.';
      default:
        return 'Sign-in failed. Please try again.';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const email = usernameField.value.trim();
    const password = passwordField.value;
    if (!email || !password) {
      showError('Please fill in both fields.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Signing in…';

    try {
      await setPersistence(auth, browserLocalPersistence);
      await signInWithEmailAndPassword(auth, email, password);
      btn.innerHTML = 'Success — redirecting…';
      window.location.replace('dashboard.html');
    } catch (err) {
      showError(friendlyError(err.code));
      btn.disabled = false;
      btn.innerHTML = btnOriginal;
    }
  });
</script>

</body>
</html>
